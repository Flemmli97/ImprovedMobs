apply from: "https://raw.githubusercontent.com/Flemmli97/GradleScripts/arch-loom-v2/common.gradle"

loom {
    accessWidenerPath.set project(":fabric").file("src/main/resources/improvedmobs.accesswidener")
}

repositories {
    mavenLocal()
    maven {
        name = "TenshiLib"
        url "https://maven.blazing-coop.net/releases"
    }
    maven {
        url "https://cursemaven.com"
    }
}

dependencies {
    modCompileOnly "io.github.flemmli97:tenshilib:${tenshilib_version}-common"
    modCompileOnly "io.github.flemmli97:runecraftory:${runecraftory_version}-common"
    modCompileOnly "${pehkui}"
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
}